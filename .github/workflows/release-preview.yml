name: Release preview

# What merging this pull request would release: which targets changed and the version each gets
# (in the job summary). Re-runs when labels change, since release:minor / release:major set the bump.
# Fails when the version files disagree or fall below a released version — the release would too.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # all history and tags: what changed since each target's last release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release -- plan --labels "$LABELS"
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
