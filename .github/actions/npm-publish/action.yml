name: Publish to npm
description: >-
  Publishes a package to npm with trusted publishing (OIDC) and provenance, then waits until npm
  serves the new version (npm scans every new version before serving it), so the steps after it
  (the MCP Registry, the tag and the GitHub release) only run for an installable version. npm
  reports a refused token exchange as a bare ENEEDAUTH, so on failure this explains it: npm's own
  log of the exchange and the exact fields the package's trusted publisher on npmjs.com must hold
  to match this job. The job needs `permissions: id-token: write`, setup-node with `registry-url`,
  `npm ci`, and a timeout that leaves room for the wait (up to an hour).

inputs:
  package:
    description: The package directory, e.g. ./packages/core
    required: true
  token:
    description: >-
      A granular npm access token, only for bootstrapping a package that has no trusted publisher yet.
      Leave empty for trusted publishing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        npm install --global npm@11   # trusted publishing needs npm >= 11.5.1
        logs="$RUNNER_TEMP/npm-publish-logs"
        if ! npm publish "$PACKAGE" --provenance --access public --logs-dir "$logs"; then
          npm run --silent release -- npm-auth-report "$PACKAGE" "$logs" || true
          exit 1
        fi
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: npm run --silent release -- wait-for-npm "$PACKAGE" --minutes 60
