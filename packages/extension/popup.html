<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>String Utility Belt</title>
<link rel="stylesheet" href="./src/ui.css" />
<style>
  body { width: 340px; background: var(--surface); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 14px; border-bottom: 1px solid var(--line); }
  .bar h1 { flex: 1; margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; }
  .bar a { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); font-size: 14px; }
  .bar a:hover { background: var(--sunk); color: var(--ink); }
  .banner {
    display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px 9px 14px;
    border-bottom: 1px solid var(--danger-line); background: var(--danger-bg);
    font-size: 12.5px; line-height: 18px; color: var(--danger-ink);
  }
  .banner > .icon { font-size: 14px; margin-top: 2px; }
  .banner span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .banner button {
    width: 20px; height: 20px; display: grid; place-items: center; border: 0; border-radius: 4px;
    background: none; color: inherit; font-size: 13px; cursor: pointer;
  }
  main { display: grid; gap: 10px; padding: 12px 14px 14px; }
  .label { display: grid; gap: 4px; }
  .label > span { font-size: 11.5px; line-height: 16px; color: var(--muted); }
  textarea.field {
    width: 100%; resize: vertical; padding: 8px 10px;
    font-family: var(--mono); font-size: 12px; line-height: 18px;
  }
  #input { min-height: 76px; background: var(--bg); }
  #output { min-height: 96px; background: var(--strip); }
  #utility { height: 32px; padding: 0 8px; font-size: 13px; }
  #pipeline-summary { margin: -4px 0 0; font-size: 11.5px; line-height: 16px; color: var(--muted); }
  #params { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
  #params:empty { display: none; }
  .param { display: grid; gap: 3px; flex: 1; min-width: 120px; }
  .param > span { font-size: 11px; line-height: 14px; color: var(--muted); }
  .param > select, .param > input { height: 28px; border-radius: 5px; background: var(--surface); }
  .param > select { padding: 0 6px; font-size: 12.5px; }
  .param > input { padding: 0 8px; font-family: var(--mono); font-size: 12px; }
  .param-bool { display: flex; align-items: center; gap: 6px; height: 28px; font-size: 12px; cursor: pointer; }
  .actions { display: flex; align-items: center; gap: 6px; }
  #status { min-width: 0; padding-left: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
  #error { margin: 0; font-size: 12.5px; line-height: 18px; color: var(--danger-ink); overflow-wrap: anywhere; }
  #error:empty { display: none; }
  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12.5px;
  }
  footer span { font-size: 11.5px; color: var(--muted); }
  footer a { font-weight: 500; color: var(--acc); }
  footer a:hover { color: var(--acc-hover); }
</style>
</head>
<body>
  <header class="bar">
    <span class="keycap" aria-hidden="true">sub</span>
    <h1>String Utility Belt</h1>
    <a id="open-options" href="options.html" target="_blank" title="Options" aria-label="Options">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
    </a>
  </header>

  <div id="last-error" class="banner" role="alert" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <span id="last-error-text"></span>
    <button id="dismiss-error" type="button" aria-label="Dismiss">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <main>
    <label class="label"><span>Text</span>
      <textarea id="input" class="field" spellcheck="false" placeholder="Paste text, or right-click a selection on the page"></textarea>
    </label>

    <label class="label"><span>Run</span>
      <select id="utility" class="select"></select>
    </label>
    <p id="pipeline-summary" hidden></p>

    <div id="params" role="group" aria-label="Settings"></div>

    <div class="actions">
      <button id="run" type="button" class="btn btn-primary">Run</button>
      <button id="copy" type="button" class="btn">Copy result</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <p id="error" role="alert"></p>

    <label class="label"><span>Result</span>
      <textarea id="output" class="field" readonly spellcheck="false"></textarea>
    </label>
  </main>

  <footer>
    <span>Runs on this device</span>
    <a id="open-app" href="https://stringutilitybelt.com" target="_blank" rel="noopener noreferrer">Open the full app &rarr;</a>
  </footer>

  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
