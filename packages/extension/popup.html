<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>String Utility Belt</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #d9dce1;
    --accent: #4f46e5; --accent-fg: #ffffff; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --fg: #f2f3f5; --muted: #9aa0ac; --line: #33353c;
      --accent: #8b8ff9; --accent-fg: #14151a; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 340px; padding: 12px;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 3px; }
  textarea, select, input[type="text"], input[type="number"] {
    width: 100%; font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  textarea { resize: vertical; min-height: 60px; font-family: ui-monospace, monospace; }
  #params { display: flex; flex-direction: column; gap: 2px; }
  #params:empty { display: none; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font: inherit; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; background: var(--accent); color: var(--accent-fg);
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--fg); }
  button:focus-visible, select:focus-visible, textarea:focus-visible,
  input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #error { color: var(--danger); font-size: 11px; margin-top: 6px; }
  #error:empty { display: none; }
  #status { color: var(--muted); font-size: 11px; min-height: 14px; margin-top: 6px; }
  footer { margin-top: 10px; text-align: right; }
  a { color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { button { transition: opacity 0.1s ease; } }
</style>
</head>
<body>
  <h1>String Utility Belt</h1>

  <label for="input">Text</label>
  <textarea id="input" spellcheck="false"></textarea>

  <label for="utility">Utility</label>
  <select id="utility"></select>

  <div id="params" role="group" aria-label="Parameters"></div>

  <div class="actions">
    <button id="run" type="button">Run</button>
    <button id="copy" type="button" class="secondary">Copy result</button>
  </div>
  <div id="error" role="alert"></div>
  <div id="status" role="status" aria-live="polite"></div>

  <label for="output">Result</label>
  <textarea id="output" readonly spellcheck="false"></textarea>

  <footer><a id="open-app" href="https://stringutilitybelt.com" target="_blank" rel="noopener noreferrer">Open full app &rarr;</a></footer>

  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
